kind = "web"
previewPath = "/"
title = "SolarFresh Cold Storage Solutions"
description = "A presentation-ready business plan web app for SolarFresh, showing how affordable solar-powered cold storage can reduce post-harvest losses, improve farmer income, and scale across rural India."
version = "1.0.0"
id = "artifacts/solarfresh"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24420

[services.development]
run = "pnpm --filter @workspace/solarfresh run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solarfresh", "run", "build" ]
serve = "static"
publicDir = "artifacts/solarfresh/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24420"
BASE_PATH = "/"
